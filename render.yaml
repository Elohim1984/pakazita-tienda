services:
  - type: web
    name: pakazita-tienda
    env: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:app" --bind 0.0.0.0:$PORT --workers 2
    autoDeploy: true

databases:
  - name: pakazita-tienda-db
    plan: starter
    region: oregon
